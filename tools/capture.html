<!doctype html><html><meta charset="utf-8"><title>Emberfall 原始场景动画采集</title><style>body{margin:0;background:#111;color:white}canvas{display:block}button,a{position:fixed;left:20px;top:20px;padding:15px;z-index:5}a{left:230px}</style><body><canvas id="scene"></canvas><button disabled id="record">加载模型</button><a id="download" style="display:none">下载视频素材</a><script type="module">
import {DungeonView} from '/src/view.js';import {Game} from '/src/game.js';
const view=new DungeonView(document.querySelector('canvas'));await view.load();const game=new Game({seed:20260930});game.start();game._enterRoom(5);game.player.x=0;game.player.z=5;game.player.facing=Math.PI;game.drainEvents();let last=performance.now();let time=0;function render(now){const dt=Math.min(.04,(now-last)/1000);last=now;time+=dt;view.render(game,dt);view.camera.position.set(Math.sin(time*.15)*5,25,24);view.camera.lookAt(0,0,-1);view.composer.render();requestAnimationFrame(render)}requestAnimationFrame(render);const button=document.querySelector('button');button.disabled=false;button.textContent='录制 12 秒场景素材';button.onclick=()=>{button.style.display='none';const stream=view.canvas.captureStream(25);const chunks=[];const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';const rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:6000000});rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const a=document.querySelector('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='emberfall-scene-source.webm';a.style.display='block';button.style.display='block';button.textContent='已完成场景录制';};rec.start();setTimeout(()=>rec.stop(),12000);};
</script></body></html>
