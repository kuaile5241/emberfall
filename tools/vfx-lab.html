<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Emberfall VFX validation</title><style>body{margin:0;background:#121b20}canvas{display:block}nav{position:fixed;right:20px;top:20px;display:flex;gap:12px}button{padding:12px;background:#172a2d;color:#eee;border:1px solid #758985}</style><canvas id="world"></canvas><nav><button data-element="fire">火</button><button data-element="lightning">雷</button><button data-element="water">水</button></nav><script type="module">
import * as THREE from 'three';import {ElementEffects} from '/src/element-effects.js';import{RuinWorld}from'/src/environment.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x151d20);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,160);camera.position.set(12.8,18,20);camera.lookAt(0,0,0);scene.add(new THREE.HemisphereLight(0xc3ced0,0x54463b,1.5));const sun=new THREE.DirectionalLight(0xd6d2b9,2.5);sun.position.set(-15,25,10);scene.add(sun);const world=new RuinWorld(scene);await world.load();const fx=new ElementEffects(scene,camera);const game={player:{x:0,z:0,shield:0},roomIndex:0,roomRewardTaken:false,rewardReady:false,areas:[]};let t=0,last=performance.now();
const cast=element=>{game.player.shield=element==='water'?35:0;game.areas=[{id:++t,x:0,z:0,element,radius:5,duration:3,remaining:3}];fx.event({type:'skill',x:0,z:0,element,radius:5,targets:[{x:-2,z:-2},{x:3,z:-2},{x:3,z:3}]});};for(const button of document.querySelectorAll('button'))button.onclick=()=>cast(button.dataset.element);window.lab={fx,game,renderer,scene,camera,cast};function frame(now){const dt=window.lab.frozen?0:Math.min((now-last)/1000,.05);last=now;game.areas.forEach(a=>a.remaining-=dt);game.areas=game.areas.filter(a=>a.remaining>0);fx.update(game,dt);world.update(game,dt);renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
